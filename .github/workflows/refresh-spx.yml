name: Refresh SPX chart at 3:30 PM Central

on:
  schedule:
    # GitHub understands America/Chicago, including daylight saving time.
    - cron: '30 15 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: spx-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check update logic
        run: python -m unittest refresh_spx_test.py refresh_context_test.py

      - name: Download real SPX prices and update 1871+ monthly series
        run: python refresh_spx.py

      - name: Merge newly verified daily closes into long OHLC archive
        run: python refresh_spx_long.py

      - name: Recompute historical candlestick study on newly completed SPX candles
        run: node generate_spx_candle_report.cjs

      - name: Recompute expanded candle-shape, reversal, wick and volatility models
        run: node spx-candle-advanced.cjs

      - name: Refresh VIX volatility and S&P 500 market breadth context
        run: python refresh_context.py

      - name: Commit changed datasets
        id: publish
        shell: bash
        run: |
          git add spx-ohlc-data.js spx-history-data.js spx-long-ohlc.js spx-candle-report.js spx-candle-advanced-data.js spx-vix-data.js spx-breadth-data.js index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No newer SPX/VIX/breadth datasets available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh SPX, candle models, VIX and market breadth data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not automatically deploy branch-based
      # GitHub Pages. Explicitly request a Pages build from the new main HEAD.
      - name: Rebuild published GitHub Pages viewer
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
