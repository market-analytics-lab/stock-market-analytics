name: Validate SPX pattern research
on:
  push:
    branches: [main]
    paths:
      - 'spx-pattern-*.js'
      - 'spx-pattern-test.cjs'
      - 'spx-candle-*.js'
      - 'spx-candle-*.css'
      - 'spx-candle-test.cjs'
      - 'spx-long-ohlc.js'
      - 'spx-long-test.cjs'
      - 'backfill_spx_daily.py'
      - 'backfill_spx_test.py'
      - 'repair_spx_gap.py'
      - 'refresh_spx_long.py'
      - 'refresh_context.py'
      - 'refresh_context_test.py'
      - '.github/workflows/test-spx-pattern.yml'
      - 'spx-ohlc-data.js'
      - 'spx-history-data.js'
      - 'spx-vix-data.js'
      - 'spx-breadth-data.js'
      - 'tv-chart.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript parses
        run: |
          node --check spx-pattern-engine.js
          node --check spx-pattern-dashboard.js
          node --check spx-pattern-context.js
          node --check tv-chart.js
          node --check spx-candle-miner.js
          node --check spx-candle-explorer.js
      - name: Walk-forward and no-leakage regression test
        run: |
          node spx-pattern-test.cjs
          node spx-candle-test.cjs
          node spx-long-test.cjs
      - name: Verify external context importer
        run: python -m unittest refresh_context_test.py backfill_spx_test.py
