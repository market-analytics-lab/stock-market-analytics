name: Rebuild labeled SPX candlestick pattern study
on:
  push:
    branches: [main]
    paths:
      - 'spx-turning-points.js'
      - 'generate_spx_candle_report.cjs'
      - '.github/workflows/build-spx-candle-report.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: spx-candle-model-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate model using 1997+ genuine daily SPX OHLC and supplied labels
        run: node generate_spx_candle_report.cjs
      - name: Commit report and publish
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- spx-candle-report.js && git ls-files --error-unmatch spx-candle-report.js >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spx-candle-report.js
          git commit -m "data: rebuild historical candle pattern evidence for six SPX labels"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy report
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
